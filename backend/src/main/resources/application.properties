# CineRate Production & Cloud Configuration
spring.application.name=cinerate
server.port=${PORT:8080}

# Session & Cookie Configuration for Cross-Origin Vercel <-> Render
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Database Configuration (Defaults to in-memory H2 if no external cloud MySQL is supplied)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:cinerate;DB_CLOSE_DELAY=-1;MODE=MySQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The Movie Database (TMDB) API Configuration
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.read-access-token=${TMDB_API_READ_ACCESS_TOKEN:}