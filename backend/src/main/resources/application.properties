
# Application Configuration
spring.application.name=cinerate
server.port=${PORT:8080}

# Database Configuration (MySQL / Cloud Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/cinerate}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The Movie Database (TMDB) API Configuration
tmdb.api.base-url=https://api.themoviedb.org/3
# Set the token in the Spring Boot runtime environment; do not store it in this file.
tmdb.api.read-access-token=${TMDB_API_READ_ACCESS_TOKEN:}