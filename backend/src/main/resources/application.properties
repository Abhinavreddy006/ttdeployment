
# Application Configuration
spring.application.name=cinerate
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinerate
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The Movie Database (TMDB) API Configuration
tmdb.api.base-url=https://api.themoviedb.org/3
# Set the token in the Spring Boot runtime environment; do not store it in this file.
tmdb.api.read-access-token=${TMDB_API_READ_ACCESS_TOKEN:}